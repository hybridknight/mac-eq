name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  checks:
    name: Checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2

      # The shared check script intentionally runs Cargo offline.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Run formatting, lint, Rust tests, and native sanitizer tests
        run: ./scripts/check.sh
