[package]
name = "maceq"
version = "1.0.0"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[features]
# Isolated UI lifecycle benchmark; never loads user settings or starts taps.
memory-profile = []

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
